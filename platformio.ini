; FPV monitor: ESP32-S3 Super Mini + RX5808 (internal) + RX5808-compatible external module
; UI on GC9A01 240x240 round display, video goes to a CVBS screen through a DPDT switch.

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    lovyan03/LovyanGFX@1.1.16
